
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vayu AGI - Cosmic AI Imagery</title>
    <meta name="description" content="Premium creative engine for high-fidelity AI images and video generation.">
    <!-- Puter.js Framework SDK -->
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
        
        :root {
            --vayu-glow: rgba(56, 189, 248, 0.4);
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            background: radial-gradient(circle at top center, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .box-glow {
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: box-shadow, border-color;
        }

        .is-generating .box-glow {
            box-shadow: 0 0 40px -10px var(--vayu-glow), 
                        inset 0 0 15px rgba(56, 189, 248, 0.05);
            border-color: rgba(56, 189, 248, 0.3) !important;
        }

        .glass-blue {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.25);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .manifest-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            background-size: 200% auto;
            transition: 0.5s;
        }
        .manifest-btn:hover:not(:disabled) {
            background-position: right center;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        .shimmer-bg {
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 6s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            animation: scan 4s infinite ease-in-out;
            z-index: 50;
            opacity: 0.5;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 0.8; }
            100% { top: 100%; opacity: 0; }
        }

        .animate-loading-bar {
            width: 0%;
            animation: loading-bar 2s infinite ease-in-out;
        }
        @keyframes loading-bar {
            0% { width: 0%; transform: translateX(-100%); }
            50% { width: 100%; transform: translateX(0%); }
            100% { width: 0%; transform: translateX(100%); }
        }

        .animate-spin-reverse {
            animation: spin-reverse 3s linear infinite;
        }
        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.4); }
        
        @media (max-width: 640px) {
            .glass-blue { backdrop-filter: blur(12px); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
<body class="selection:bg-sky-500/30">
    <div id="particles-container" class="fixed inset-0 pointer-events-none -z-10"></div>
    <div id="root"></div>
    <!-- Vite entry point -->
    <script type="module" src="/index.tsx"></script>
</body>
</html>
