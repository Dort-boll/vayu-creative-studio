<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vayu - Pure Puter Creative Engine</title>
    <meta name="description" content="Next-generation creative engine powered strictly by Puter.js modules.">
    <!-- Puter.js Framework SDK -->
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
        
        :root {
            --vayu-glow: rgba(56, 189, 248, 0.4);
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --safe-top: env(safe-area-inset-top);
        }

        html { 
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Unified Smooth Glass System */
        .glass-blue {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .manifest-btn {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.8) 0%, rgba(129, 140, 248, 0.8) 50%, rgba(192, 132, 252, 0.8) 100%);
            background-size: 200% auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.2);
            will-change: transform, box-shadow;
        }
        .manifest-btn:hover:not(:disabled) {
            background-position: right center;
            box-shadow: 0 10px 40px -10px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }
        .manifest-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            animation: scan 4s infinite linear;
            z-index: 50;
            filter: blur(1px);
        }
        @keyframes scan {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(1000%); opacity: 0; }
        }

        .shimmer-bg {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.03) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            background-size: 200% 100%;
            animation: shimmer 4s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .neo-card {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform, border-color;
        }
        .neo-card:hover {
            border-color: rgba(56, 189, 248, 0.25);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
        }
        
        /* Smooth Mobile Navigation Fixes */
        @media (max-width: 640px) {
            .glass-blue { backdrop-filter: blur(16px); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
<body class="selection:bg-sky-500/30">
    <div id="particles-container" class="fixed inset-0 pointer-events-none -z-10 opacity-30"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
